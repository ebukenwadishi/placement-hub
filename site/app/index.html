<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Placement Hub" />
<meta name="description" content="Placement Hub: a simple supported-accommodation workspace demo using made-up records." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<title>Placement Hub</title>
<style>
:root{
  --blue:#1f5fbf;--blue-d:#174a96;--blue-dd:#123a75;--blue-50:#eef4fc;--blue-100:#d6e4f7;
  --ink:#14243b;--text:#2b3b52;--muted:#5b697e;--line:#e2e7ee;--bg:#f4f6f9;
  --good:#16794d;--good-bg:#e6f4ec;--warn:#93560a;--warn-bg:#fff1d9;--bad:#b3261e;--bad-bg:#fdeceb;--grey:#56657a;--grey-bg:#eef1f5;
  --r:16px;--shadow:0 1px 2px #14243b0d,0 4px 14px #14243b0a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #7aa7ea;outline-offset:2px}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.25}
svg{flex:none}

/* layout */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:10;background:#fffffff2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top-in{height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1000px;margin:0 auto}
.brand-sm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.4px;color:var(--ink);background:none;border:0;padding:0}
.brand-sm b,.side .brand b{color:var(--blue);font-weight:800}
.logo{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center}
.top-right{display:flex;align-items:center;gap:8px}
.top-date{display:none;color:var(--ink);font-size:16px;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;color:var(--text);flex:none}
.icon-btn:hover{background:#f6f8fb}
.dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.demo-pill{font-size:12px;font-weight:700;color:var(--blue-d);background:var(--blue-50);border:1px solid var(--blue-100);padding:4px 10px;border-radius:999px;white-space:nowrap}
.page{max-width:860px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) calc(116px + env(safe-area-inset-bottom))}

/* headings */
.page-head{margin:4px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:28px;letter-spacing:-.5px}
.eyebrow{display:block;font-size:14px;font-weight:650;color:var(--blue);margin:0 0 4px}
.lead{color:var(--muted);margin:6px 0 0;font-size:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px;gap:10px}
.section-head h2{font-size:19px}
.link{background:none;border:0;color:var(--blue);font-weight:650;font-size:15px;padding:8px 4px;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}
.back{background:none;border:0;color:var(--blue);font-weight:650;font-size:16px;display:inline-flex;align-items:center;gap:4px;padding:6px 0;margin:0 0 12px}

/* cards and rows */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:12px}
.pad{padding:16px}
.list .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);min-height:68px;width:100%;text-align:left;background:none;color:inherit}
.list .row:last-child{border-bottom:0}
button.row:hover,.row-main:hover{background:#f8fafd}
.row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;border-radius:10px}
.grow{flex:1;min-width:0}
.row b,.entry b{display:block;color:var(--ink);font-weight:650;font-size:16px;line-height:1.35}
.sub{display:block;color:var(--muted);font-size:14px;margin-top:2px;line-height:1.4}
.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}.t-good{color:var(--good)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#a7b3c2}
.sdot.good{background:var(--good)}.sdot.warn{background:#d68d1c}.sdot.bad{background:var(--bad)}
.chev{color:#9aa6b6}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--blue-50);color:var(--blue)}
.ico.bad{background:var(--bad-bg);color:var(--bad)}.ico.warn{background:var(--warn-bg);color:var(--warn)}.ico.good{background:var(--good-bg);color:var(--good)}.ico.grey{background:var(--grey-bg);color:var(--grey)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--blue-50);color:var(--blue-dd);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.avatar.lg{width:60px;height:60px;font-size:19px}
.avatar.pic{overflow:hidden;background:var(--blue-50)}
.avatar.pic img,.avatar.pic svg{width:100%;height:100%;display:block;object-fit:cover}
.avatar.xl{width:132px;height:132px;font-size:36px}
.avatar-btn{position:relative;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;flex:none;min-width:44px;min-height:44px}
.avatar-btn .cam{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.photo-pick{display:grid;justify-items:center;gap:12px;margin:4px 0 16px}
.photo-pick .btn{width:100%}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:650;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--grey-bg);color:var(--grey)}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--blue-50);color:var(--blue-d)}
.chip-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* entries (records with text) */
.entry{padding:16px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.entry p{margin:8px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.entry-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.entry-foot>span{display:inline-flex;align-items:center;gap:6px}
.edge-bad{box-shadow:inset 4px 0 0 var(--bad)}.edge-warn{box-shadow:inset 4px 0 0 #e0a43a}
.labelled{margin-top:10px;font-size:15px}.labelled small{display:block;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}
.day-label:first-of-type{margin-top:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;font-weight:650;font-size:15px;border:1px solid transparent;white-space:nowrap;text-decoration:none;background:none}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.secondary{background:#fff;border-color:#cbd5e1;color:var(--ink)}.btn.secondary:hover{background:#f6f8fb}
.btn.danger{background:#fff;border-color:#efbdb8;color:var(--bad)}.btn.danger:hover{background:#fff6f5}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* home */
.handover-card{padding:16px;border-color:var(--blue-100);background:linear-gradient(180deg,#f7faff,#fff)}
.handover-card .hc-top{display:flex;gap:12px;align-items:center}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:12px 0 0;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;min-height:118px;color:inherit}
.tile b{font-size:16px;color:var(--ink);line-height:1.3}.tile span.d{font-size:14px;color:var(--muted);line-height:1.4}
.tile:hover{border-color:var(--blue-100);background:#fbfdff}

/* controls */
.seg{display:flex;gap:4px;background:#e8ecf2;padding:4px;border-radius:14px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:650;font-size:15px;color:var(--muted);white-space:nowrap;min-height:44px}
.seg button.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 3px #14243b24}
.seg em{font-style:normal;font-weight:700;margin-left:6px;opacity:.75}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.fchip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:650;white-space:nowrap;color:var(--text);min-height:40px}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:0 12px;margin-bottom:12px;color:var(--muted)}
.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #1f5fbf26}
.search-box input{border:0;outline:0;flex:1;min-width:0;padding:12px 0;font-size:16px;background:none;color:var(--ink)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--blue-50);border:1px solid var(--blue-100);color:#23426f;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5;margin-bottom:16px}
.notice.warn{background:#fff7e8;border-color:#f1dcb2;color:#6b4a10}
.notice svg{margin-top:2px}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.small-note{font-size:14px;color:var(--muted);margin:16px 4px 0}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}

/* profile */
.profile-head{padding:18px}
.ph-top{display:flex;gap:14px;align-items:center}
.ph-top h1{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}.facts dd{margin:2px 0 0;font-weight:650;color:var(--ink);font-size:15px}
.action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.action-row .btn{padding:10px 8px;font-size:14px}
.tl-item{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-item p{margin:6px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.kv>div:last-child{border-bottom:0}
.kv span{color:var(--muted)}.kv b{color:var(--ink);text-align:right}
.goals{margin:0;padding:6px 16px 6px 40px}
.plan-btns .btn{font-size:15px}
.plan-btns + .action-row{margin-top:8px}
.plan-doc h3{font-size:16px;margin:20px 0 6px;color:var(--ink)}
.plan-doc p{margin:0;font-size:16px;line-height:1.55}
.plan-doc .card{margin-top:10px}
.plan-doc .goals li{font-size:16px}
.plan-doc .plan-foot{margin-top:20px}
.plan-doc .acc .sub{white-space:normal}
.acc-body{padding:0 16px 14px}
.acc-body .labelled:first-child{margin-top:0}
.act{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.act:first-of-type{margin-top:6px}
.act b{font-weight:600;font-size:15px;display:block}
.edit-row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;border:1px solid var(--line);border-radius:14px;padding:12px}
.edit-row > b{grid-column:1/-1;font-size:14px;color:var(--muted)}
.plan-doc .edit-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.plan-doc .signoff-btn{margin-top:14px}
.step-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:14px}
.plan-doc .chip-line .chip{margin:0 6px}
.goals li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.goals li:last-child{border-bottom:0}
.quote{font-size:17px;line-height:1.5;color:var(--ink);border-left:4px solid var(--blue);padding:2px 0 2px 14px;margin:10px 0}

/* tasks */
.tick{width:32px;height:32px;border-radius:50%;border:2px solid #b3bfce;background:#fff;display:grid;place-items:center;flex:none;color:#fff;padding:0}
.tick.on{background:var(--blue);border-color:var(--blue)}
.tick:hover{border-color:var(--blue)}
.done-row b{text-decoration:line-through;color:var(--muted)}
.due{font-size:14px;font-weight:650;color:var(--muted);white-space:nowrap}.due.bad{color:var(--bad)}

/* evidence */
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{transition:transform .15s}
.acc[open] summary .chev{transform:rotate(90deg)}
.check-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.check-item input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:1px 0 0}
.progress{height:10px;background:#e5eaf1;border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--blue);border-radius:99px}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.progress-head b{color:var(--ink)}.progress-head span{font-size:22px;font-weight:750;color:var(--blue-d)}

/* reports */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:16px}.stat b{display:block;font-size:30px;color:var(--ink);letter-spacing:-1px;line-height:1.1}.stat span{font-size:14px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:120px 1fr 28px;gap:12px;align-items:center;padding:8px 0;font-size:15px}
.bar-row b{text-align:right;color:var(--ink)}

/* rota */
.day-nav{display:flex;align-items:center;gap:10px;padding:12px}
.day-nav .grow{text-align:center}
.day-nav input{border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;font-size:16px;background:#fff;max-width:100%}
.mini-bar{width:70px;height:6px;border-radius:9px;background:#e5eaf1;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.mini-bar span{display:block;height:100%;background:var(--blue)}

/* documents rows that wrap on phones */
.row-end{display:flex;align-items:center;gap:10px;flex:none}

/* more page */
.more-group{margin-bottom:22px}
.more-group h2{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px}

/* tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:#fffffff7;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:650;color:#68768a;padding:6px 0 2px;position:relative;min-height:54px}
.tabbar button.on{color:var(--blue)}
.tabbar .rec .plus{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px #1f5fbf59;margin-top:-26px;border:4px solid #fff}
.tabbar .count{position:absolute;top:0;left:calc(50% + 4px);border:2px solid #fff;height:22px;min-width:22px}

/* sheets */
.sheet-layer{position:fixed;inset:0;z-index:50;background:#0b1a2e85;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px 0;animation:up .22s ease-out;overscroll-behavior:contain;outline:none}
.sheet:before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:#d3dae4;margin:4px auto 12px}
.sheet:after{content:'';display:block;height:calc(14px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-head h2{font-size:22px;padding-top:6px}
.help{color:var(--muted);font-size:15px;margin:0 0 16px}
.sheet .list{border:1px solid var(--line);border-radius:var(--r)}
.sheet-foot{position:sticky;bottom:0;background:#fff;display:flex;gap:10px;padding:12px 0 14px;margin-top:16px;border-top:1px solid var(--line);z-index:2}
.sheet-foot .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.field{display:flex;flex-direction:column;gap:6px;grid-column:1/-1;min-width:0}
.field.half{grid-column:auto}
.field>span{font-size:15px;font-weight:650;color:var(--ink)}
.field>small{color:var(--muted);font-size:13px;margin-top:-2px}
.field input,.field select,.field textarea{width:100%;min-height:50px;border:1px solid #c3cdda;border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink);min-width:0}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #1f5fbf2e}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.choice label{position:relative;display:block}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;padding:8px 10px;border:1.5px solid #c3cdda;border-radius:12px;font-weight:650;font-size:15px;background:#fff;line-height:1.25}
.choice input:checked+span{border-color:var(--blue);background:var(--blue-50);color:var(--blue-dd)}
.choice input:focus-visible+span{outline:3px solid #7aa7ea}
pre.csv{background:#f6f8fb;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;max-height:220px;overflow:auto;white-space:pre}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:#13233a;color:#fff;border-radius:14px;padding:14px 16px;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #0b1a2e40;transform:translateY(16px);opacity:0;pointer-events:none;transition:.2s}
.toast.show{transform:none;opacity:1}

/* support worker view */
.notice.bad{background:var(--bad-bg);border-color:#f2c4bf;color:#6e1a14}

.where-line{margin-top:12px;font-size:15px;font-weight:600}
.action-row.two{grid-template-columns:1fr 1fr}
.me-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:15px;flex:none}

.me-card .link{padding:0}
.search-box.as-btn{width:100%;min-height:50px;text-align:left;font-size:16px;color:var(--muted);margin-bottom:22px}
.side-foot .me-card{box-shadow:none;margin:0 -4px 10px;padding:10px;width:calc(100% + 8px)}
.side-foot p{margin:0}
@media(max-width:899px){.desk-only{display:none}}

/* sign in */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#e6effc 0%,var(--bg) 60%);width:100%}
.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px #14243b14;padding:28px 22px 18px}

.login-brand b{color:var(--blue);font-weight:800}
.login-brand .logo{width:40px;height:40px;border-radius:12px}
.login h1{font-size:28px;letter-spacing:-.5px}
.login .lead{margin:6px 0 20px}
.login-form{display:flex;flex-direction:column;gap:16px}
.field>label{font-size:15px;font-weight:650;color:var(--ink)}
.pw{position:relative}
.pw input{padding-right:76px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font-weight:650;font-size:15px;padding:8px 10px;border-radius:8px;min-height:40px}
.remember{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);cursor:pointer}

.forgot{margin-top:8px}

.privacy-link{display:inline-block;padding:12px 6px;color:var(--blue);font-weight:650;white-space:nowrap}
.me-card.static{box-shadow:none;margin-bottom:14px}

@keyframes spin{to{transform:rotate(360deg)}}

  ui.busy = true; ui.authError = ''; render();
  try { await u.reload(); } catch (e) { return authFail(authMessage(e)); }
  const now = fb.auth.currentUser;
  if (now && now.emailVerified) { try { await now.getIdToken(true); } catch (e) { /* carry on */ } ui.justSignedIn = true; enterLive(now); }
  else authFail('We can’t see the confirmation yet. Open the link in the email, then try again.');
}
async function resendVerification() {
  const u = fb && fb.auth.currentUser; if (!u) return;
  const wait = 60 - Math.round((Date.now() - (ui.lastSent || 0)) / 1000);
  if (wait > 0) return authFail(`You can send it again in ${wait} seconds.`);
  ui.busy = true; ui.authError = ''; render();
  try { await sendVerification(u); ui.busy = false; ui.authInfo = `Sent again to ${u.email}. Check your spam or junk folder too.`; render(); }
  catch (e) { authFail(authMessage(e)); }
}
async function liveReset(email) {
  email = String(email || '').trim().toLowerCase(); ui.loginEmail = email;
  if (!email) return authFail('Enter your email above, then tap “Forgot your password?” again.', 'loginEmail');
  ui.busy = true; ui.authError = ''; render();
  const quiet = e => /user-not-found/.test(String(e && e.code));
  try { await fb.A.sendPasswordResetEmail(fb.auth, email, actionSettings()); }
  catch (e) {
    if (/continue-uri/.test(String(e.code))) { try { await fb.A.sendPasswordResetEmail(fb.auth, email); } catch (e2) { if (!quiet(e2)) return authFail(authMessage(e2)); } }
    else if (!quiet(e)) return authFail(authMessage(e));
  }
  ui.busy = false; ui.authInfo = `If there’s an account for ${email}, we’ve emailed a link to reset the password. Check your spam or junk folder too.`; render();
}

};
function workerView(full) {

/* ---- Shifts: day 07:30–19:30 and night 19:30–07:30, as on the rota.
   "This shift" runs from the shift's start (or the moment it was started, if earlier).
   A night shift started after midnight belongs to the night that began the evening before. ---- */
const SHIFT_HOURS = { Day: ['07:30', '19:30'], Night: ['19:30', '07:30'] };
function shiftWindow(s) {
  const night = s.type === 'Night', [a, b] = SHIFT_HOURS[night ? 'Night' : 'Day'];
  const day = night && s.start < '12:00' ? addDays(s.date, -1) : s.date;
  const nominal = atTime(day, a), to = atTime(b > a ? day : addDays(day, 1), b);
  const prev = night ? atTime(day, SHIFT_HOURS.Day[0]) : atTime(addDays(day, -1), SHIFT_HOURS.Night[0]);
  return { from: Math.min(nominal, atTime(s.date, s.start)), to, prev, night };
}
const sinceShiftStart = (date, time) => { const s = myShift(); return !s || atTime(date, time) >= shiftWindow(s).from; };
const noteThisShift = y => d.notes.find(n => n.youngId === y.id && sinceShiftStart(n.date, n.time));

/* what's on this shift's agenda, and what the last shift left unrecorded */
function shiftAgenda(ys) {
  const w = shiftWindow(myShift());
  const dates = [...new Set([w.prev, w.from, w.to].map(ms => isoOf(new Date(ms))))];
  const doses = dates.flatMap(dt => dosesOn(dt, ys)), appts = dates.flatMap(dt => apptsOn(dt, ys));
  const at = x => atTime(x.date, x.due || x.time), within = (x, a, b) => at(x) >= a && at(x) < b;
  return {
    doses: doses.filter(x => within(x, w.from, w.to)), appts: appts.filter(a => within(a, w.from, w.to)),
    leftDoses: doses.filter(x => within(x, w.prev, w.from) && !x.rec && doseState(x) === 'Overdue'),
    leftAppts: appts.filter(a => within(a, w.prev, w.from) && apptNeedsOutcome(a)), at
  };
}

  if (!isWorker()) d.young.forEach(y => { const sp = (y.supportPlan || {}).version === '0', ra = (y.riskAssessment || {}).version === '0'; if (sp || ra) out.push({ tone: 'warn', ic: 'file', t: `${y.name} needs ${sp && ra ? 'a risk assessment and support plan' : ra ? 'a risk assessment' : 'a support plan'}`, s: `New at ${y.home}. Write ${sp && ra ? 'them' : 'it'} with ${y.name.split(' ')[0]}, then sign off.`, go: 'person-' + y.id }); });

      <div class="section-head"><h2>The team</h2></div>

function repairs() {

function about() {
  const ideas = [['Clearcare', 'Recording, safeguarding and regulatory reports for children’s services.', 'Clearer links from a young person’s words to incidents, actions and oversight.'], ['RoundSys', 'Care rounds, point-of-care logs, tasks and handovers.', 'The same shift-first simplicity, built for supported accommodation.'], ['Log my Care', 'Handovers and incident logging, including safeguarding.', 'Track everything that follows an incident, through to review.'], ['Nourish Care', 'Personalised plans, mobile recording and insights.', 'Keep supported-accommodation priorities front and centre.'], ['CareDocs', 'Custom support plans and assessments.', 'Add an Ofsted evidence map and document approvals.'], ['Person Centred Software', 'Mobile recording and data-led oversight.', 'Make independence goals first-class.'], ['Care Control', 'Care management, rota and staff tools.', 'Bring shifts, follow-up and accountability together.'], ['QCS', 'Policy, audit and compliance guidance.', 'Link policies to real examples of practice.'], ['Birdie', 'Scheduling and visit management.', 'Adapt scheduling to residential shifts and keywork.'], ['Microsoft SharePoint', 'Document libraries, versions and approvals.', 'Structured workflows around documents, not just storage.']];
  return head('About this demo') +
    `<div class="card pad"><p style="margin:0 0 10px"><b style="color:var(--ink)">Placement Hub is a prototype.</b> All young people, staff and records are made up.</p><ul style="margin:0;padding-left:20px;line-height:1.7"><li>Don’t enter real information about young people or staff.</li><li>Changes are saved in this browser on this device only.</li><li>Nothing is sent to Ofsted, the police, the council or anyone else.</li></ul>
      <div class="btn-row"><button class="btn secondary" data-sheet="welcome">Show the welcome again</button><button class="btn danger" data-sheet="reset">${icon('refresh', 18)} Reset sample data</button>${SITE_URL ? `<a class="btn secondary" href="${SITE_URL}">${icon('back', 18)} Visit the website</a>` : ''}</div>${PRIVACY_URL ? `<p class="small-note" style="margin:6px 0 0"><a class="privacy-link" style="padding:12px 0;white-space:normal" href="${PRIVACY_URL}">How the demo handles your information</a></p>` : ''}</div>
    <div class="section-head"><h2>Design notes</h2></div>

}

const field = (label, inner, half, hint) => `<label class="field ${half ? 'half' : ''}"><span>${label}</span>${hint ? `<small>${hint}</small>` : ''}${inner}</label>`;
const choiceField = (label, name, opts, value) => `<div class="field" role="radiogroup" aria-label="${label}"><span>${label}</span><div class="choice">${opts.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<label><input type="radio" name="${name}" value="${esc(v)}" ${v === value ? 'checked' : ''}><span>${esc(t)}</span></label>`; }).join('')}</div></div>`;
const sel = (name, opts, value) => `<select name="${name}">${opts.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
const inp = (name, type, value, attrs = '') => `<input name="${name}" type="${type}" value="${esc(value ?? '')}" ${attrs}>`;
const area = (name, ph, value = '', req = true) => `<textarea name="${name}" placeholder="${esc(ph)}" maxlength="800" ${req ? 'required' : ''}>${esc(value)}</textarea>`;
const youngOpts = () => d.young.map(y => [y.id, `${y.name} · ${y.home}`]);
const form = (kind, inner, saveLabel = 'Save') => `<form data-form="${kind}"><div class="form-grid">${inner}</div><div class="sheet-foot"><button type="button" class="btn secondary" data-close>Cancel</button><button type="submit" class="btn primary">${saveLabel}</button></div></form>`;
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const SHEETS = {
  dose: sd => {

    if (!opts.length) return { title: 'Record medication', body: empty('No medication plans', myShift() ? 'Nobody in this house has medication in their plan.' : 'Nobody has medication in their plan.') };
    const pre = sd.young ? (d.meds.find(x => x.youngId === sd.young && medActive(x)) || {}).id : undefined;

  },
  appt: sd => ({ title: 'Add an appointment', body: form('appt',
    field('Young person', sel('youngId', youngOpts(), sd.young)) +
    field('What kind?', sel('type', ['GP', 'Dentist', 'Hospital or clinic', 'College or school', 'Social worker visit', 'Personal adviser', 'Housing', 'Job Centre', 'Other'], 'GP')) +
    field('Date', inp('date', 'date', TODAY, 'required'), true) + field('Time', inp('time', 'time', '10:00', 'required'), true) +
    field('Where?', inp('where', 'text', '', 'required maxlength="80" placeholder="e.g. Town Surgery"')) +

  ypPhoto: sd => {

      `<input type="hidden" name="youngId" value="${y.id}"><input type="hidden" name="photo" value="">
      <div class="photo-pick"><span class="avatar pic xl" id="photoPreview">${avatarInner(y)}</span>
        <label class="btn secondary">${icon('camera', 18)} Take or choose a photo<input type="file" accept="image/*" data-photo-input hidden></label>
        ${PHOTO_OK(y.photo) ? `<button type="button" class="btn secondary" data-photo-remove="${y.id}">Remove photo</button>` : ''}</div>` +
      notice('This demo uses made-up records. Don’t upload a photo of a real young person.', true), 'Save picture') };
  },
  ypNew: () => ({ title: 'Add a young person', help: 'This starts their file. Next, write their risk assessment and support plan from their page.', body: form('ypNew',
    field('Name', inp('name', 'text', '', 'required maxlength="40" autocomplete="off" placeholder="e.g. Jordan K."'), false, 'First name and the first letter of their surname.') +
    field('Date of birth', inp('dob', 'date', '', `required max="${TODAY}"`), true) + field('Moving in on', inp('moveIn', 'date', TODAY, 'required'), true) +

    choiceField('Risk level for now', 'risk', LEVELS, 'Medium') + '<p class="small-note" style="grid-column:1/-1;margin:-6px 0 0">Change it when you write their risk assessment.</p>' +
    `<div style="grid-column:1/-1">${notice('This demo uses made-up records. Don’t add a real young person.', true)}</div>`, 'Add young person') }),
  ypArchive: sd => {

  },

    const date = (label, name, value, half = true, req = false) => field(label, inp(name, 'date', value || '', req ? 'required' : ''), half);
    if (part === 'details') {
      const legal = [...new Set([...LEGAL_STATUS, p.legal].filter(Boolean))];

function searchResults() {
  const q = ui.searchQ.trim().toLowerCase();
  if (!q) return `<p class="help">Try “Jordan”, “risk” or “tile”.</p>`;
  const has = (...xs) => xs.some(x => String(x).toLowerCase().includes(q));
  const res = [
    ...d.young.filter(y => has(y.name, y.home, y.keyworker)).map(y => ['person-' + y.id, 'users', y.name, `Young person · ${y.home}`]),
    ...(d.archived || []).filter(y => has(y.name, y.home, y.keyworker)).map(y => ['person-' + y.id, 'archive', y.name, `Archived file · left ${fmt(y.left.date)}`]),
    ...d.incidents.filter(i => has(i.id, i.type, i.description, nameOf(i.youngId))).map(i => ['concern-' + i.id, 'alert', i.type, `${i.id} · ${nameOf(i.youngId)}`]),
    ...d.tasks.filter(t => has(t.title, t.subject, t.owner)).map(t => ['tasks?tab=' + (t.done ? 'Done' : 'Open'), 'checklist', t.title, `Task · ${t.subject}`]),
    ...d.docs.filter(x => has(x.name, x.subject)).map(x => ['documents', 'file', x.name, `Document · ${x.subject}`]),
    ...d.repairs.filter(r => has(r.issue, r.area, r.home)).map(r => ['repairs', 'tools', `${r.area} · ${r.home}`, r.issue])

  return res.length ? `<div class="list">${res.map(([go, ic, t, s]) => `<button class="row" data-go="${go}"><span class="ico">${icon(ic)}</span><span class="grow"><b>${esc(t)}</b><span class="sub">${esc(s)}</span></span><span class="chev">${icon('chev', 18)}</span></button>`).join('')}</div>` : empty('No results', 'Try another word.');

function buildCsv(kind) {

    incidents: ['Concerns and incidents', [['Ref', 'Date', 'Young person', 'Home', 'Type', 'Severity', 'Status', 'Summary'], ...d.incidents.map(i => [i.id, i.date, nameOf(i.youngId), (person(i.youngId) || {}).home, i.type, i.severity, i.status, i.description])]],
    missing: ['Missing register', [['Ref', 'Date', 'Young person', 'Home', 'Status', 'Summary'], ...d.incidents.filter(i => /missing/i.test(i.type)).map(i => [i.id, i.date, nameOf(i.youngId), (person(i.youngId) || {}).home, i.status, i.description])]],
    repairs: ['Repairs', [['Home', 'Area', 'Issue', 'Priority', 'Status', 'Reported'], ...d.repairs.map(r => [r.home, r.area, r.issue, r.priority, r.status, r.reported])]],
    standards: ['Quality standards evidence', [['Standard', 'Regulation', 'Evidence check', 'Where to look', 'Evidenced'], ...d.standards.flatMap(s => s.items.map(it => [s.name, s.ref, it.label, it.link, it.done ? 'Yes' : 'No']))]],
    checklist: ['Service checklist', [['Area', 'Check', 'Done'], ...d.checklist.flatMap(c => c.items.map(it => [c.title, it[0], it[1] ? 'Yes' : 'No']))]],
    notes: ['Daily notes', [['Date', 'Time', 'Young person', 'Mood', 'Education', 'Note', 'For next shift', 'Written by'], ...d.notes.map(n => [n.date, n.time, nameOf(n.youngId), n.mood, n.education, n.note, n.next, n.staff])]],
    moves: ['In and out log', [['Date', 'Young person', 'Out', 'Back by', 'Back', 'Where', 'Signed out by'], ...d.moves.map(m => [m.date, nameOf(m.youngId), m.out, m.backBy, m.back || 'Still out', m.where, m.staff])]],
    medication: ['Medication records', [['Date', 'Time', 'Young person', 'Medicine', 'Dose due', 'What happened', 'Recorded by', 'Note'], ...d.medLog.map(r => [r.date, r.time, nameOf(r.youngId), medName(r.medId), r.due || 'When needed', r.outcome, r.staff, r.note])]],
    appointments: ['Appointments', [['Date', 'Time', 'Young person', 'Type', 'Where', 'With', 'Status', 'Notes'], ...d.appts.map(a => [a.date, a.time, nameOf(a.youngId), a.type, a.where, a.with, a.status, a.outcomeNote || a.note])]],
    summary: ['Summary', [['Measure', 'Value'], ['Date', TODAY], ['Young people', d.young.length], ['Open concerns', openConcerns().length], ['Open tasks', d.tasks.filter(t => !t.done).length], ['Overdue tasks', overdueTasks().length], ['Handovers to read', unread().length], ['Reg 27 decisions waiting', pendingReviews().length]]]
  };
  const [name, data] = rows[kind] || rows.summary;
  return { name, file: `placement-hub-${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.csv`, csv: data.map(r => r.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n') };
}

function signIn(email, password, remember) {

/* Routes live in the address as #home, #people, #person-yp1, #concern-INC-104 … */
const hashOf = () => ui.route === 'people' && ui.sub ? 'person-' + ui.sub : ui.route === 'safeguarding' && ui.sub ? 'concern-' + ui.sub : ui.route;
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('person-')) { ui.route = 'people'; ui.sub = h.slice(7); }
  else if (h.startsWith('concern-')) { ui.route = 'safeguarding'; ui.sub = h.slice(8); }
  else { ui.route = ROUTES.includes(h) ? h : 'home'; ui.sub = null; }
}
function go(target) {
  const [path, q] = target.split('?');
  const before = hashOf();
  if (path.startsWith('person-')) { ui.route = 'people'; ui.sub = path.slice(7); ui.tab.person = 'timeline'; }
  else if (path.startsWith('concern-')) { ui.route = 'safeguarding'; ui.sub = path.slice(8); }
  else { ui.route = ROUTES.includes(path) ? path : 'home'; ui.sub = null; }
  if (q) new URLSearchParams(q).forEach((v, k) => { if (k === 'tab') ui.tab[ui.route] = v; });
  ui.sheet = null; ui.sheetData = {};
  const after = hashOf();
  if (after !== before || location.hash.slice(1) !== after) { try { location.hash = after; } catch (e) { render(); } }
  else render();
}
let lastRoute = null, lastSheet = null;
function render() {
  const root = document.getElementById('app');

    case 'note': {
      d.notes.unshift({ id: uid('dn'), youngId: v.youngId, date: TODAY, time: nowTime(), staff: me().name, mood: v.mood, education: v.education, note: trim(v.note), next: trim(v.next) });
      msg = `Daily note saved for ${nameOf(v.youngId)}`; break;
    }
    case 'signOut': {
      const open = d.moves.find(m => m.youngId === v.youngId && !m.back);
      if (open) { toast(`${nameOf(v.youngId)} is already signed out. Sign them back in first.`); return; }
      d.moves.unshift({ id: uid('mv'), youngId: v.youngId, date: TODAY, out: v.out, backBy: v.backBy, where: trim(v.where), staff: me().name, back: null, backDate: null });
      msg = `${nameOf(v.youngId)} signed out. Back by ${v.backBy}.`; break;
    }
    case 'keywork': { const y = person(v.youngId); y.keywork.unshift({ date: v.date, topic: trim(v.topic), note: trim(v.note) }); msg = 'Keywork session saved'; dest = 'person-' + y.id; break; }
    case 'incident': {
      const id = nextIncidentId();
      d.incidents.unshift({ id, youngId: v.youngId, date: v.date, type: v.type, severity: v.severity, status: 'Open', description: trim(v.description) });
      if (sd.moveId) { const m = d.moves.find(x => x.id === sd.moveId); if (m) m.incident = id; }
      msg = `${id} saved. Nothing has been sent to anyone.`; dest = 'concern-' + id; break;
    }
    case 'handover': d.handovers.push({ id: uid('h'), date: v.date, home: v.home, shift: v.shift, author: me().name, summary: trim(v.summary), actions: trim(v.actions), ack: false }); msg = 'Handover saved'; dest = 'log?tab=handovers'; break;
    case 'repair': d.repairs.unshift({ id: uid('m'), home: v.home, area: v.area, issue: trim(v.issue), priority: v.priority, status: 'Open', reported: TODAY }); msg = 'Repair reported'; ui.tab.repairs = 'Open'; dest = 'repairs'; break;
    case 'task': d.tasks.unshift({ id: uid('t'), title: trim(v.title), subject: v.subject, owner: v.owner, due: v.due, priority: v.priority, done: false }); msg = 'Task added'; dest = 'tasks?tab=Open'; break;
    case 'reg27': d.reviews.unshift({ id: uid('n'), incidentId: v.incidentId, decision: 'Pending', reason: trim(v.reason), date: TODAY }); msg = 'Review started. Nothing has been sent.'; dest = 'safeguarding?tab=reg27'; break;
    case 'document': d.docs.unshift({ id: uid('doc'), name: v.name, subject: v.subject, owner: v.owner, version: 1, status: 'Pending approval', review: v.review }); msg = 'Document added'; dest = 'documents'; break;
    case 'shift': d.shifts.push({ id: uid('s'), staffId: v.staffId, home: v.home, date: v.date, start: v.start, end: v.end }); ui.rotaDate = v.date; msg = 'Shift added'; dest = 'team?tab=rota'; break;
    case 'message': d.messages.unshift({ id: uid('msg'), by: me().name, subject: trim(v.subject), body: trim(v.body), date: TODAY, time: nowTime() }); msg = 'Message posted'; dest = 'team?tab=messages'; break;
    case 'leave': if (v.to < v.from) { toast('The end date can’t be before the start date'); return; } d.leave.unshift({ id: uid('l'), staff: me().name, from: v.from, to: v.to, reason: v.reason, status: 'Pending' }); msg = 'Leave request sent'; dest = 'team?tab=leave'; break;
  }
  ui.sheet = reopen ? reopen[0] : null; ui.sheetData = reopen ? reopen[1] : {};
  if (dest) go(dest); else render();
  toast(msg);
});

   ================================================================ */
readHash();
if (!session && location.hash === '#signup') { ui.authScreen = 'signup'; ui.wantSignup = true; }
if (session && !seenWelcome()) ui.sheet = 'welcome';
render();
if (authMode === 'live') startLiveAuth();
if (!inFrame && 'serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* not available */ } });
}
})();
</script>
